<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EITASM Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">

            <a class="navbar-brand fw-bold" href="../index.html">
                EITASM
            </a>

            <div class="navbar-nav ms-auto">

                <a class="nav-link" href="dashboard.html">
                    Dashboard
                </a>

                <a class="nav-link" href="employees.html">
                    Employees
                </a>

                <a class="nav-link" href="assets.html">
                    Hardware Assets
                </a>

                <a class="nav-link" href="licenses.html">
                    Software Licenses
                </a>

                <a class="nav-link" href="incidents.html">
                    Security Incidents
                </a>

                <a class="nav-link active" href="login.html">
                    Login
                </a>

            </div>

        </div>
    </nav>


    <!-- LOGIN -->
    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-7 col-lg-5">

                <div class="card shadow-sm border-0">

                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-4">

                            <h1 class="h3 mb-2">
                                Sign In
                            </h1>

                            <p class="text-muted mb-0">
                                Access the EITASM management system.
                            </p>

                        </div>


                        <!-- ERROR MESSAGE -->
                        <div
                            id="loginError"
                            class="alert alert-danger d-none"
                            role="alert">
                            Invalid email or password.
                        </div>


                        <form id="loginForm" novalidate>

                            <!-- EMAIL -->
                            <div class="mb-3">

                                <label
                                    for="email"
                                    class="form-label">
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    placeholder="name@example.com"
                                    required
                                >

                                <div class="invalid-feedback">
                                    Please enter a valid email address.
                                </div>

                            </div>


                            <!-- PASSWORD -->
                            <div class="mb-3">

                                <label
                                    for="password"
                                    class="form-label">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    placeholder="Enter your password"
                                    minlength="6"
                                    required
                                >

                                <div class="invalid-feedback">
                                    Password must contain at least 6 characters.
                                </div>

                            </div>


                            <!-- REMEMBER / FORGOT -->
                            <div class="d-flex justify-content-between align-items-center mb-4">

                                <div class="form-check">

                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        id="rememberMe"
                                    >

                                    <label
                                        class="form-check-label"
                                        for="rememberMe">
                                        Remember me
                                    </label>

                                </div>

                                <a
                                    href="#"
                                    class="text-decoration-none">
                                    Forgot password?
                                </a>

                            </div>


                            <!-- SIGN IN -->
                            <button
                                type="submit"
                                class="btn btn-primary w-100">
                                Sign In
                            </button>

                        </form>


                        <!-- REGISTER -->
                        <div class="text-center mt-4">

                            <span class="text-muted">
                                Don't have an account?
                            </span>

                            <a
                                href="register.html"
                                class="text-decoration-none">
                                Create Account
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <script>

        const loginForm = document.getElementById("loginForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const rememberMe = document.getElementById("rememberMe");
        const loginError = document.getElementById("loginError");


        loginForm.addEventListener("submit", function (event) {

            event.preventDefault();

            loginError.classList.add("d-none");


            // HTML FORM VALIDATION
            if (!loginForm.checkValidity()) {

                loginForm.classList.add("was-validated");

                return;
            }


            const email = emailInput.value.trim();
            const password = passwordInput.value;


            // DEFAULT ADMIN ACCOUNT
            const adminUser = {
                email: "admin@eitasm.com",
                password: "admin123",
                name: "Danny",
                role: "Administrator"
            };


            // USERS CREATED FROM REGISTER PAGE
            const registeredUsers =
                JSON.parse(localStorage.getItem("eitasmUsers")) || [];


            // CHECK DEFAULT ADMIN
            let authenticatedUser = null;


            if (
                email === adminUser.email &&
                password === adminUser.password
            ) {

                authenticatedUser = adminUser;

            } else {

                // CHECK REGISTERED USERS
                authenticatedUser = registeredUsers.find(
                    user =>
                        user.email === email &&
                        user.password === password
                );

            }


            // LOGIN SUCCESS
            if (authenticatedUser) {

                const sessionUser = {
                    email: authenticatedUser.email,
                    name: authenticatedUser.name || "User",
                    role: authenticatedUser.role || "User"
                };


                if (rememberMe.checked) {

                    localStorage.setItem(
                        "eitasmCurrentUser",
                        JSON.stringify(sessionUser)
                    );

                } else {

                    sessionStorage.setItem(
                        "eitasmCurrentUser",
                        JSON.stringify(sessionUser)
                    );

                }


                window.location.href = "dashboard.html";

            }

            // LOGIN FAILED
            else {

                loginError.classList.remove("d-none");

                passwordInput.value = "";

                passwordInput.focus();

            }

        });

    </script>

</body>

</html>
