<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EITASM Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">
                EITASM
            </a>

            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="dashboard.html">
                    Dashboard
                </a>

                <a class="nav-link" href="employees.html">
                    Employees
                </a>

                <a class="nav-link" href="assets.html">
                    Hardware Assets
                </a>

                <a class="nav-link" href="licenses.html">
                    Software Licenses
                </a>

                <a class="nav-link" href="incidents.html">
                    Security Incidents
                </a>

                <a class="nav-link active" href="login.html">
                    Login
                </a>
            </div>
        </div>
    </nav>

    <main class="container py-5">

        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">

                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-4">
                            <h1 class="h3 mb-2">
                                Sign In
                            </h1>

                            <p class="text-muted mb-0">
                                Access the EITASM management system.
                            </p>
                        </div>

                        <form>

                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    Email Address
                                </label>

                                <input type="email" class="form-control" id="email" placeholder="name@example.com"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    Password
                                </label>

                                <input type="password" class="form-control" id="password"
                                    placeholder="Enter your password" required>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-4">

                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rememberMe">

                                    <label class="form-check-label" for="rememberMe">
                                        Remember me
                                    </label>
                                </div>

                                <a href="#" class="text-decoration-none">
                                    Forgot password?
                                </a>

                            </div>

                            <a href="dashboard.html" class="btn btn-primary w-100">
                                Sign In
                            </a>

                        </form>

                    </div>
                </div>

            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
