<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EITASM Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">
                EITASM
            </a>
        </div>
    </nav>

    <main class="container py-5">
        <h1 class="mb-4">Dashboard</h1>

        <div class="row g-4">

            <div class="col-md-6 col-lg-3">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title">Employees</h5>
                        <p class="display-6">700</p>
                        <p class="text-muted mb-0">
                            Registered employees
                        </p>
                    </div>
                </div>
            </div>

            <div class="col-md-6 col-lg-3">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title">Hardware Assets</h5>
                        <p class="display-6">425</p>
                        <p class="text-muted mb-0">
                            Managed devices
                        </p>
                    </div>
                </div>
            </div>

            <div class="col-md-6 col-lg-3">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title">Software Licenses</h5>
                        <p class="display-6">86</p>
                        <p class="text-muted mb-0">
                            Active licenses
                        </p>
                    </div>
                </div>
            </div>

            <div class="col-md-6 col-lg-3">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title">Security Incidents</h5>
                        <p class="display-6">12</p>
                        <p class="text-muted mb-0">
                            Open incidents
                        </p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
